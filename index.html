<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maru Art Space — Visual Design & Illustration</title>
<meta name="description" content="Maru Art Space — visual design and illustration. E-commerce design, restaurant menus, illustration, motion and original animal prints.">
<meta property="og:title" content="Maru Art Space — Visual Design & Illustration">
<meta property="og:description" content="E-commerce design, menus, illustration, motion and prints.">
<meta property="og:type" content="website">
<meta property="og:image" content="exp-flamenco-cat.jpg">
<link rel="preload" href="archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";src:url(archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}

:root{
  --stone:#e9e6dc;--ink:#131316;--olive:#b3b56f;--lav:#b9a9e3;--saffron:#e2a93a;--rose:#e3a8a3;--brick:#c5462d;
  --bg:var(--olive);--fg:var(--ink);--line:rgba(19,19,22,.3);--mut:rgba(19,19,22,.88);--ph:#e4e2d3;--dot:rgba(255,255,244,.3);
  --font:"Archivo",system-ui,sans-serif;
  --gut:clamp(16px,3vw,44px);
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="lavender"]{--bg:var(--lav);--fg:var(--ink);--line:rgba(19,19,22,.3);--mut:rgba(19,19,22,.86);--ph:#a999d6}
[data-theme="dark"]{--bg:var(--ink);--fg:var(--stone);--line:rgba(230,228,223,.3);--mut:rgba(230,228,223,.88);--ph:#222228}
[data-theme="saffron"]{--bg:var(--saffron);--fg:var(--ink);--line:rgba(19,19,22,.32);--mut:rgba(19,19,22,.88);--ph:#cf9a33}
[data-theme="rose"]{--bg:var(--rose);--fg:var(--ink);--line:rgba(19,19,22,.3);--mut:rgba(19,19,22,.88);--ph:#d59a95}
[data-theme="brick"]{--bg:var(--brick);--fg:var(--stone);--line:rgba(230,228,223,.4);--mut:rgba(230,228,223,.95);--ph:#b33d26}

*{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .9s var(--ease),color .9s var(--ease)}
main{overflow-x:clip}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.disp{font-stretch:62%;font-weight:600;text-transform:uppercase;line-height:.84;letter-spacing:-.005em}
.lab{font-stretch:125%;font-weight:500;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.3}
.sec{background:var(--bg);color:var(--fg);padding:clamp(90px,12vw,190px) var(--gut)}
html.fx .sec,html.fx .hero,html.fx .deckpin{background:transparent}
.h2{font-size:clamp(64px,13vw,240px)}
.lead{max-width:34em;color:var(--fg);margin-top:20px;font-size:clamp(17px,1.4vw,21px)}
.ul{background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/100% 1px;padding-bottom:2px;transition:background-size .5s var(--ease)}
.ul:hover{background-size:0% 1px;background-position:100% 100%}

.btn{display:inline-block;position:relative;border:1px solid var(--fg);padding:17px 30px;overflow:hidden;isolation:isolate;transition:color .45s var(--ease)}
.btn::before{content:"";position:absolute;inset:0;background:var(--fg);transform:translateY(101%);transition:transform .45s var(--ease);z-index:-1}
.btn:hover{color:var(--bg)}
.btn:hover::before{transform:none}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.solid::before{background:var(--bg)}
.btn.solid:hover{color:var(--fg)}

/* paper grain */
body::after{content:"";position:fixed;inset:0;z-index:95;pointer-events:none;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
@media (hover:none){body::after{mix-blend-mode:normal;opacity:.04}}

/* soft light on the hero */
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 80% at 18% 0%,rgba(236,238,186,.75) 0%,rgba(236,238,186,0) 70%)}

/* polka-dot field */
.polka{position:absolute;inset:-12% 0;pointer-events:none;background-image:radial-gradient(circle,var(--dot) 0 33%,transparent 35%);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse 62% 58% at 42% 40%,#000 0%,transparent 100%);mask-image:radial-gradient(ellipse 62% 58% at 42% 40%,#000 0%,transparent 100%)}

/* header */
.top{position:fixed;inset:0 0 auto;z-index:100;height:64px;padding:0 var(--gut);display:flex;align-items:center;justify-content:space-between;gap:20px;color:#fff;mix-blend-mode:difference}
html.fx .top{mix-blend-mode:normal;color:var(--fg);transition:color .9s var(--ease)}
.nav{display:flex;gap:26px}
.lang{display:flex;gap:4px}
.lang button{padding:6px 5px;opacity:.6;transition:opacity .3s}
.lang button.on{opacity:1}

/* hero */
.hero{position:relative;height:100svh;min-height:560px;display:flex;flex-direction:column;padding:76px var(--gut) 22px;overflow:hidden;background:var(--bg)}
.table{position:relative;flex:1;min-height:0}
.hcard{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);width:clamp(120px,14.5vw,225px)}
.hcard-in{aspect-ratio:3/4;background:var(--ph);box-shadow:0 26px 44px -18px rgba(40,42,10,.55),0 2px 6px rgba(40,42,10,.2);overflow:hidden;transform:rotate(calc(var(--r) * 1deg));cursor:grab;user-select:none;-webkit-user-drag:none}
.hcard-in.grab{cursor:grabbing}
.hcard-in img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.hint{position:absolute;right:var(--gut);top:78px;z-index:70;display:flex;align-items:center;gap:10px;pointer-events:none;color:var(--mut)}
.hint::before{content:"";width:34px;height:1px;background:currentColor}
.hero-foot{position:relative;z-index:60;pointer-events:none}
.hero h1{display:inline-block;white-space:nowrap;font-size:17vw;font-stretch:62%;font-weight:600;text-transform:uppercase;line-height:.8;letter-spacing:-.005em}
.hero h1 .l{display:inline-block;font-variation-settings:"wght" var(--w,600),"wdth" 62}
.hero-meta{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:20px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.hero-meta p{font-size:16px;line-height:1.35;color:var(--fg);max-width:30em}
.hero-meta span:last-child{text-align:right}

/* about */
.about p{font-size:clamp(28px,4.4vw,76px);font-weight:500;font-stretch:88%;line-height:1.06;letter-spacing:-.015em;max-width:19em}
.about .w{transition:none}
html.fx .about .w{opacity:.38}
.about .lab{display:block;margin-bottom:26px;color:var(--mut)}

/* selected deck */
.deckpin{position:relative;background:var(--bg);color:var(--fg);padding:clamp(90px,12vw,190px) var(--gut)}
.dhead{display:flex;justify-content:space-between;gap:20px;margin-bottom:34px}
.dtitles,.dfoot{display:none}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px}
.dcard{display:block}
.dmedia{aspect-ratio:3/4;background:var(--ph);overflow:hidden;box-shadow:0 30px 60px -26px rgba(19,19,22,.5)}
.dmedia img,.dmedia video{width:100%;height:100%;object-fit:cover}
.dcap{padding-top:12px}
.dcap h3{font-size:30px;font-stretch:62%;font-weight:600;text-transform:uppercase;line-height:1}
.dcap p{font-size:14px;color:var(--mut);margin-top:4px}
html.fx .deckpin{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:82px var(--gut) 26px}
html.fx .dhead{margin:0;position:relative;z-index:3}
html.fx .dtitles{display:block;position:absolute;inset:0;z-index:1;pointer-events:none}
html.fx .dt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:100px}
html.fx .deck{display:block;position:relative;z-index:2;place-self:center;width:min(400px,78vw,calc(58svh * .75));aspect-ratio:3/4}
html.fx .dcard{position:absolute;inset:0;will-change:transform}
html.fx .dmedia{height:100%;aspect-ratio:auto}
html.fx .dcap{display:none}
html.fx .dfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;position:relative;z-index:3;border-top:1px solid var(--line);padding-top:12px}
.ddesc{position:relative;flex:1;min-height:2.8em;max-width:30em}
.ddesc p{position:absolute;left:0;bottom:0;font-size:17px;line-height:1.35}
.dcount{display:flex;align-items:center;gap:10px}
.dcount i{width:34px;height:1px;background:currentColor}

/* work */
.windex{display:flex;flex-wrap:wrap;gap:6px 30px;margin:clamp(34px,5vw,70px) 0 clamp(70px,9vw,130px);border-top:1px solid var(--line);padding-top:20px}
.windex a{font-size:clamp(20px,2.1vw,32px);font-weight:450;letter-spacing:-.015em;line-height:1.2;transition:opacity .3s}
.windex a sup{font-stretch:125%;font-weight:500;font-size:11.5px;letter-spacing:.05em;margin-left:5px;vertical-align:top;position:relative;top:.5em;color:var(--mut)}
.windex:hover a{opacity:.35}
.windex a:hover{opacity:1}
.group{margin-bottom:clamp(80px,10vw,150px)}
.group:last-child{margin-bottom:0}
.group-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-top:1px solid var(--fg);padding-top:14px;margin-bottom:26px}
.group-h h3{font-size:clamp(30px,3.8vw,62px);font-weight:450;letter-spacing:-.025em;line-height:1}
.group-h .lab{color:var(--mut);white-space:nowrap;padding-bottom:.4em}
.grid{columns:4 220px;column-gap:18px}
.tile{break-inside:avoid;margin-bottom:22px;cursor:zoom-in}
.tile .im{overflow:hidden;background:var(--ph);transition:transform .7s var(--ease),box-shadow .7s var(--ease)}
.tile:hover .im{transform:translateY(-8px) rotate(-1.4deg);box-shadow:0 30px 44px -20px rgba(40,42,10,.6)}
.tile:nth-child(even):hover .im{transform:translateY(-8px) rotate(1.4deg)}
.tile img{width:100%;height:auto;transition:transform 1.1s var(--ease)}
.tile:hover img{transform:scale(1.045)!important}
.tile figcaption{font-size:15px;color:var(--fg);margin-top:9px;line-height:1.3}
.tile.hidden{display:none}
.more{margin-top:8px}

/* motion */
.strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;margin:clamp(34px,4.5vw,64px) calc(var(--gut) * -1) 0;padding:0 var(--gut) 20px;scrollbar-width:none;cursor:grab}
.strip::-webkit-scrollbar{display:none}
.strip.grab{cursor:grabbing;scroll-snap-type:none}
.strip video{flex:none;width:clamp(190px,20vw,280px);aspect-ratio:9/16;object-fit:cover;background:var(--ph);scroll-snap-align:start}
.note{margin-top:16px;color:var(--fg);font-size:16px}
.note a{color:var(--fg)}

/* mar de luz */
.md-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:var(--gut);margin-top:clamp(40px,5vw,80px);align-items:start}
.md-cols .lead{margin-top:0}
.md-cols .btn{margin-top:30px}
.jewels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.jewels figure{overflow:hidden;background:var(--ph);aspect-ratio:3/4;cursor:zoom-in}
.jewels figure:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.jewels img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.jewels figure:hover img{transform:scale(1.045)}

/* playground: works spill out under the pointer */
.play{position:relative;overflow:hidden;min-height:68svh;display:grid;place-items:center;text-align:center;padding-top:clamp(60px,7vw,110px);padding-bottom:clamp(60px,7vw,110px)}
html:not(.fx) .play{display:none}
.play .h2{font-size:clamp(64px,15vw,290px)}
.play .lab{display:block;margin-bottom:26px;color:var(--mut)}
#trail{position:absolute;inset:0;z-index:2;pointer-events:none}
.tcard{position:absolute;left:0;top:0;width:clamp(130px,15vw,230px);aspect-ratio:3/4;overflow:hidden;background:var(--ph);box-shadow:0 26px 44px -18px rgba(60,20,20,.55);will-change:transform}
.tcard img{width:100%;height:100%;object-fit:cover}

/* contact */
.contact{text-align:center;padding-bottom:22px;position:relative;overflow:hidden}
#peas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.contact>*:not(canvas){position:relative;z-index:1}
.peahint{display:none;margin-bottom:26px;color:var(--mut)}
html.fx .peahint{display:block}
.contact .h2{font-size:clamp(64px,15vw,290px)}
.contact .btn{margin-top:clamp(36px,5vw,64px)}
.mail{display:inline-block;margin-top:26px;font-size:clamp(18px,1.7vw,24px)}
.socials{list-style:none;display:flex;justify-content:center;gap:10px 28px;flex-wrap:wrap;margin-top:22px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);margin-top:clamp(80px,10vw,140px);padding-top:14px;text-align:left}

/* lightbox */
.lb{position:fixed;inset:0;z-index:180;background:rgba(19,19,22,.96);color:var(--stone);display:none;align-items:center;justify-content:center;padding:var(--gut)}
.lb.open{display:flex}
.lb img{max-height:84svh;max-width:100%;object-fit:contain}
.lb button{position:absolute;padding:16px}
.lb .x{top:6px;right:var(--gut)}.lb .p{left:var(--gut);bottom:10px}.lb .nx{right:var(--gut);bottom:10px}
.lb .cap{position:absolute;bottom:26px;left:25%;right:25%;text-align:center;font-size:14px;color:rgba(230,228,223,.7)}

@media (max-width:900px){
  .nav{display:none}
  .hcard{width:35vw}
  .hcard:nth-child(n+7){display:none}
  .hcard:nth-child(1){--x:2;--y:6;--r:-6}
  .hcard:nth-child(2){--x:33;--y:0;--r:4}
  .hcard:nth-child(3){--x:63;--y:9;--r:-3}
  .hcard:nth-child(4){--x:5;--y:47;--r:5}
  .hcard:nth-child(5){--x:35;--y:52;--r:-5}
  .hcard:nth-child(6){--x:62;--y:45;--r:6}
  .hero h1{white-space:normal;font-size:30vw}
  .hero h1 .ln{display:block;white-space:nowrap}
  .hero-meta{grid-template-columns:1fr auto}
  .hero-meta p{display:none}
  .hint{top:70px}
  .dhead span:last-child{display:none}
  .grid{columns:2 140px;column-gap:12px}.tile{margin-bottom:16px}
  .md-cols{grid-template-columns:1fr}
  .lb .cap{left:28%;right:28%}
}
</style>
</head>
<body>

<header class="top lab">
  <a href="#top" id="brand">Maru Art Space</a>
  <nav class="nav">
    <a href="#selected" data-link data-t="nav_sel"></a>
    <a href="#work" data-link data-t="nav_work"></a>
    <a href="#motion" data-link>Motion</a>
    <a href="#mardeluz" data-link>Mar de Luz</a>
    <a href="#contact" data-link data-t="nav_contact"></a>
  </nav>
  <div class="lang" role="group" aria-label="Language"><button class="lab" data-lang="en">EN</button><button class="lab" data-lang="es">ES</button></div>
</header>

<main id="top">
  <section class="hero" id="hero" data-theme="olive">
    <div class="polka" id="polka" aria-hidden="true"></div>
    <div class="hint lab" id="hint"></div>
    <div class="table" id="table"></div>
    <div class="hero-foot">
      <h1 id="heroH" aria-label="Maru Art Space"></h1>
      <div class="hero-meta"><span class="lab" data-t="hero_role"></span><p data-t="hero_p"></p><span class="lab" data-t="scroll"></span></div>
    </div>
  </section>

  <section class="sec about" data-theme="olive">
    <span class="lab" data-t="about_l"></span>
    <p id="about" data-t="about"></p>
  </section>

  <section id="selected" data-theme="lavender">
    <div class="deckpin" id="deckpin">
      <div class="dhead"><span class="lab" data-t="sel_h"></span><span class="lab" data-t="sel_hint"></span></div>
      <div class="dtitles" id="dtitles" aria-hidden="true"></div>
      <div class="deck" id="deck"></div>
      <div class="dfoot"><div class="ddesc" id="ddesc"></div><div class="dcount lab"><span id="dnum">01</span><i></i><span>06</span></div></div>
    </div>
  </section>

  <section class="sec" id="work" data-theme="olive">
    <h2 class="disp h2" data-t="work_h"></h2>
    <p class="lead" data-t="work_p"></p>
    <div class="windex" id="windex"></div>
    <div id="gal"></div>
  </section>

  <section class="sec" id="motion" data-theme="dark">
    <h2 class="disp h2">Motion</h2>
    <p class="lead" data-t="mot_p"></p>
    <div class="strip" id="strip"></div>
    <p class="note"><span data-t="mot_note"></span> <a class="ul" href="https://www.instagram.com/maru.art.space">Instagram</a>, <a class="ul" href="https://www.tiktok.com/@maru.art.space">TikTok</a></p>
  </section>

  <section class="sec" id="mardeluz" data-theme="saffron">
    <h2 class="disp h2">Mar de Luz Lab</h2>
    <div class="md-cols">
      <div><p class="lead" data-t="md_p"></p><a class="btn lab" href="https://mardeluzlab.github.io/" data-t="md_go"></a></div>
      <div class="jewels" id="jewels"></div>
    </div>
  </section>

  <section class="sec play" id="play" data-theme="rose">
    <div id="trail" aria-hidden="true"></div>
    <div><span class="lab" id="playhint"></span><h2 class="disp h2" data-t="play_h"></h2></div>
  </section>

  <section class="sec contact" id="contact" data-theme="brick">
    <canvas id="peas" aria-hidden="true"></canvas>
    <span class="lab peahint" id="peahint"></span>
    <h2 class="disp h2" data-t="cr_h"></h2>
    <a class="btn solid lab" href="mailto:maruartti@gmail.com" data-t="write"></a>
    <div><a class="mail ul" href="mailto:maruartti@gmail.com">maruartti@gmail.com</a></div>
    <ul class="socials lab">
      <li><a class="ul" href="https://t.me/maruartspace">Telegram</a></li>
      <li><a class="ul" href="https://www.instagram.com/maru.art.space">Instagram</a></li>
      <li><a class="ul" href="https://www.tiktok.com/@maru.art.space">TikTok</a></li>
      <li><a class="ul" href="https://www.behance.net/maruartist">Behance</a></li>
    </ul>
    <div class="foot lab">
      <span>Maru Art Space © 2026</span>
      <a class="ul" href="https://maruartspace.github.io/maru-tech-wing" data-t="tech"></a>
    </div>
  </section>
</main>

<div class="lb" id="lb" aria-hidden="true">
  <button class="lab x" data-t="close"></button>
  <button class="lab p" data-t="prev"></button>
  <img alt="">
  <button class="lab nx" data-t="next"></button>
  <div class="cap"></div>
</div>

<script src="gsap.min.js"></script>
<script src="ScrollTrigger.min.js"></script>
<script src="lenis.min.js"></script>
<script>

  ["card-planters-set.jpg","Set of three planters","Set de tres maceteros"],

  ["card-helmet-gold.jpg","Motorcycle helmet","Casco de moto"],

  ["card-rope.jpg","Jump rope","Comba"],
  ["card-helmet-gzhel.jpg","Helmet, Gzhel","Casco, Gzhel"]
 ]},
 {id:"menus",t:["Menus","Cartas"],show:5,items:[

/* ---------- effects ---------- */
if(fx){
  const hero=document.getElementById("hero");
  const letters=[...heroH.querySelectorAll(".l")];
  const cards=[...document.querySelectorAll(".hcard")], inner=cards.map(c=>c.firstElementChild);

  /* opening: the cards are dealt onto the table, then the title rises */
  inner.forEach((c,i)=>gsap.set(c,{rotation:HERO[i][3]}));
  const deal=gsap.timeline({delay:.1});
  deal.from(inner,{y:innerHeight,rotation:()=>gsap.utils.random(-40,40),duration:1.5,ease:"expo.out",stagger:.07})
      .from(letters,{yPercent:105,opacity:0,duration:1.1,ease:"expo.out",stagger:.03},.35)
      .from(".hero-meta,.hint,.top",{opacity:0,duration:1},.9);

  /* letters thin out under the pointer */
  const wave=px=>letters.forEach(l=>{const r=l.getBoundingClientRect(),d=Math.abs(px-(r.left+r.width/2)),k=Math.max(0,1-d/(innerWidth*.18));
    gsap.to(l,{"--w":600-k*400,duration:.5,ease:"power2.out",overwrite:"auto"})});
  if(fine){hero.addEventListener("pointermove",e=>wave(e.clientX));hero.addEventListener("pointerleave",()=>wave(-9999))}
  else ScrollTrigger.create({trigger:hero,start:"top top",end:"bottom top",onUpdate:s=>wave(s.progress>0.01?s.progress*innerWidth*1.5-innerWidth*.2:-9999)});

  /* drag and toss the cards (mouse), tap to bring one forward (touch) */
  let z=10;
  inner.forEach(c=>{
    let on=false,lx=0,ly=0,vx=0,vy=0,x=0,y=0;
    c.addEventListener("pointerdown",e=>{
      c.parentElement.style.zIndex=++z;
      if(e.pointerType!=="mouse"){gsap.fromTo(c,{scale:1.08},{scale:1,rotation:gsap.utils.random(-8,8),duration:.9,ease:"expo.out"});return}
      on=true;c.setPointerCapture(e.pointerId);c.classList.add("grab");gsap.killTweensOf(c);
      x=+gsap.getProperty(c,"x");y=+gsap.getProperty(c,"y");lx=e.clientX;ly=e.clientY;vx=vy=0;gsap.to(c,{scale:1.05,duration:.3});
    });
    c.addEventListener("pointermove",e=>{if(!on)return;vx=e.clientX-lx;vy=e.clientY-ly;lx=e.clientX;ly=e.clientY;x+=vx;y+=vy;gsap.set(c,{x,y})});
    const up=()=>{if(!on)return;on=false;c.classList.remove("grab");
      gsap.to(c,{x:x+vx*10,y:y+vy*10,rotation:"+="+Math.max(-20,Math.min(20,vx*.5)),scale:1,duration:1.1,ease:"expo.out"})};
    c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
  });

  /* leaving the hero: the pile drifts apart */
  cards.forEach((c,i)=>{const dir=(HERO[i][1]+8-50)/50;
    gsap.to(c,{x:dir*innerWidth*.3,y:-innerHeight*(.12+(i%3)*.1),rotation:dir*22,ease:"none",scrollTrigger:{trigger:hero,start:"top top",end:"bottom top",scrub:.6}})});

  /* about: words come into focus */
  gsap.to("#about .w",{opacity:1,stagger:.1,ease:"none",scrollTrigger:{trigger:"#about",start:"top 82%",end:"bottom 50%",scrub:true}});

  /* selected work: the deck. Each scroll step throws the top card left or right */
  const dc=[...document.querySelectorAll(".dcard")],dt=[...document.querySelectorAll(".dt")],dd=[...document.querySelectorAll(".ddesc p")],n=dc.length;
  const tilt=[-2,1.6,-1.1,2.2,-1.6,1],dnum=document.getElementById("dnum");
  dc.forEach((c,i)=>gsap.set(c,{zIndex:n-i,rotation:tilt[i%6]}));
  gsap.set(dt.slice(1),{opacity:0,y:90});gsap.set(dd.slice(1),{opacity:0});
  const flip=gsap.timeline({scrollTrigger:{trigger:"#deckpin",start:"top top",end:()=>"+="+innerHeight*(n-1)*.6,pin:true,scrub:.5,invalidateOnRefresh:true,
    onUpdate:s=>{dnum.textContent=pad(1+Math.round(s.progress*(n-1)))}}});
  dc.slice(0,-1).forEach((c,i)=>{const dir=i%2?1:-1;
    flip.to(c,{x:()=>dir*(innerWidth*.5+c.offsetWidth*1.3),y:()=>-innerHeight*.08,rotation:dir*26,ease:"power2.in",duration:1},i)
        .to(dt[i],{opacity:0,y:-90,duration:.45,ease:"power2.in"},i+.2)
        .to(dt[i+1],{opacity:1,y:0,duration:.5,ease:"power2.out"},i+.6)
        .to(dd[i],{opacity:0,duration:.3},i+.3)
        .to(dd[i+1],{opacity:1,duration:.3},i+.65)});

  /* gallery pictures */
  const tiles=[...document.querySelectorAll(".tile:not(.hidden) .im")];hide(tiles);
  const io=new IntersectionObserver(es=>{const inn=es.filter(e=>e.isIntersecting).map(e=>e.target);if(!inn.length)return;inn.forEach(t=>io.unobserve(t));reveal(inn.map(t=>t.querySelector(".im")))},{rootMargin:"0px 0px -5% 0px"});
  tiles.forEach(t=>io.observe(t.parentElement));

  /* big headings rise once */
  document.querySelectorAll(".sec .h2").forEach(h=>gsap.from(h,{yPercent:40,opacity:0,duration:1.3,ease:"expo.out",scrollTrigger:{trigger:h,start:"top 92%"}}));

  /* playground: the whole portfolio spills out under the pointer, card by card */
  (()=>{
    const sec=document.getElementById("play"),layer=document.getElementById("trail");
    const all=GROUPS.map(g=>g.items.map(i=>i[0])),pool=[];
    for(let r=0;pool.length<all.flat().length;r++)all.forEach(g=>{if(g[r])pool.push(g[r])});
    let k=0,lx=-999,ly=-999,live=0,timer=0,warm=false;
    const tint=["#e2a93a","#b9a9e3","#b3b56f","#c5462d","#e9e6dc"];
    const spawn=(x,y)=>{
      if(live>18)return;live++;
      const el=document.createElement("div");el.className="tcard";
      const im=new Image();im.alt="";im.onerror=()=>{im.remove();el.style.background=tint[k%tint.length]};im.src=pool[k++%pool.length];el.append(im);layer.append(el);
      const r=gsap.utils.random(-14,14);
      gsap.set(el,{x,y,xPercent:-50,yPercent:-50,rotation:r,scale:.5,opacity:0});
      gsap.timeline({onComplete:()=>{el.remove();live--}})
        .to(el,{scale:1,opacity:1,duration:.5,ease:"expo.out"})
        .to(el,{y:y+gsap.utils.random(170,320),rotation:r+gsap.utils.random(-30,30),opacity:0,duration:.9,ease:"power2.in"},"+=1.5");
    };
    const at=e=>{const r=sec.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    sec.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const[x,y]=at(e);if(Math.hypot(x-lx,y-ly)<95)return;lx=x;ly=y;spawn(x,y)});
    sec.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;const[x,y]=at(e);for(let i=0;i<3;i++)spawn(x+gsap.utils.random(-70,70),y+gsap.utils.random(-70,70))});
    new IntersectionObserver(es=>{const vis=es[0].isIntersecting;clearInterval(timer);if(!vis)return;
      if(!warm){warm=true;pool.slice(0,14).forEach(src=>{new Image().src=src})}
      const rnd=()=>spawn(sec.clientWidth*gsap.utils.random(.1,.9),sec.clientHeight*gsap.utils.random(.18,.8));
      for(let i=0;i<5;i++)setTimeout(rnd,i*110);
      timer=setInterval(rnd,480);
    },{threshold:.2}).observe(sec);
  })();

  /* polka field drifts a little slower than the page */
  gsap.to("#polka",{yPercent:9,ease:"none",scrollTrigger:{trigger:hero,start:"top top",end:"bottom top",scrub:true}});

  /* finale: peas pour in, pile up above the footer line and run away from the pointer */
  (()=>{
    const sec=document.getElementById("contact"),cv=document.getElementById("peas"),ctx=cv.getContext("2d"),foot=sec.querySelector(".foot");
    const cols=["#e9e6dc","#e2a93a","#e3a8a3","#b3b56f","#b9a9e3","#131316"];
    let W=0,H=0,ps=[],on=false,vis=false,left=0,mx=-9999,my=-9999,calm=0,tick=0;
    const size=()=>{const d=Math.min(devicePixelRatio||1,2);W=sec.clientWidth;H=foot.offsetTop-6;cv.style.height=H+"px";cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)};
    const add=x=>{const k=W<600?.6:1;ps.push({x,y:-30-Math.random()*260,vx:(Math.random()-.5)*4,vy:Math.random()*3,r:(9+Math.random()*25)*k,c:cols[ps.length%cols.length]})};
    const frame=()=>{
      if(!on)return;tick++;
      if(left>0&&tick%3===0){add(Math.random()*W);left--}
      let fast=0;
      for(const p of ps){
        p.vy+=.5;p.vx*=.992;
        const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy)||1;
        if(d<120){const f=(120-d)/120*2.2;p.vx+=dx/d*f;p.vy+=dy/d*f}
        p.x+=p.vx;p.y+=p.vy;
      }
      for(let it=0;it<3;it++){
        for(let i=0;i<ps.length;i++){const a=ps[i];
          for(let j=i+1;j<ps.length;j++){const b=ps[j],dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;
            if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
            const d=Math.hypot(dx,dy)||.01;if(d>=m)continue;
            const nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
            const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const im=rv*.6;a.vx+=nx*im;a.vy+=ny*im;b.vx-=nx*im;b.vy-=ny*im}
          }
          if(a.x<a.r){a.x=a.r;a.vx=Math.abs(a.vx)*.4}
          if(a.x>W-a.r){a.x=W-a.r;a.vx=-Math.abs(a.vx)*.4}
          if(a.y>H-a.r){a.y=H-a.r;a.vy=-Math.abs(a.vy)*.3;a.vx*=.9}
        }
      }
      ctx.clearRect(0,0,W,H);
      for(const p of ps){const sp=Math.abs(p.vx)+Math.abs(p.vy);if(sp>.9)fast++;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill()}
      calm=(fast===0&&left===0)?calm+1:0;
      if(calm>90){on=false;return}
      requestAnimationFrame(frame);
    };
    const wake=()=>{calm=0;if(!on&&vis){on=true;requestAnimationFrame(frame)}};
    let poured=false;
    new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(!vis){on=false;return}
      poured=true;size();ps=[];left=W<600?42:80;wake()},{threshold:.12}).observe(sec);
    sec.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;wake()});
    sec.addEventListener("pointerleave",()=>{mx=my=-9999});
    sec.addEventListener("click",e=>{if(e.target.closest("a,button")||ps.length>170)return;const r=cv.getBoundingClientRect();
      for(let i=0;i<7;i++)add(e.clientX-r.left+(Math.random()-.5)*120);wake()});
    addEventListener("resize",()=>{if(!poured)return;size();ps.forEach(p=>{p.x=Math.min(p.x,W-p.r)});wake()});
  })();

  /* the page colour follows the section in view */
  const secs=[...document.querySelectorAll("[data-theme]")].filter(s=>s!==document.body);
  secs.forEach(s=>{const th=s.dataset.theme;s.removeAttribute("data-theme");
    ScrollTrigger.create({trigger:s,start:"top 55%",end:"bottom 55%",onToggle:self=>{if(self.isActive)document.body.dataset.theme=th}})});
  document.body.dataset.theme="olive";

  let rt;document.querySelectorAll("main img").forEach(im=>{if(!im.complete)im.addEventListener("load",()=>{clearTimeout(rt);rt=setTimeout(()=>ScrollTrigger.refresh(),200)})});
  addEventListener("load",()=>{fit();ScrollTrigger.refresh()});
}

/* keep the place after a language switch */
(()=>{const y=sstore.get("mas-y");if(!y)return;sstore.set("mas-y","");
  setTimeout(()=>{if(libs)ScrollTrigger.refresh();lenis?lenis.scrollTo(+y,{immediate:true}):scrollTo(0,+y)},80)})();

/* lightbox */
const lb=document.getElementById("lb"),lbImg=lb.querySelector("img"),lbCap=lb.querySelector(".cap");
let set=[],idx=0;
const show=i=>{idx=(i+set.length)%set.length;lbImg.src=set[idx].src;lbImg.alt=set[idx].cap;lbCap.textContent=set[idx].cap;
  if(fx)gsap.fromTo(lbImg,{opacity:0,scale:.97},{opacity:1,scale:1,duration:.6,ease:"expo.out"})};
document.addEventListener("click",e=>{
  const t=e.target.closest(".tile,.jewels figure");if(!t)return;
  const els=[...t.parentElement.children].filter(x=>!x.classList.contains("hidden"));
  set=els.map(x=>({src:x.dataset.src,cap:x.dataset.cap||""}));
  show(els.indexOf(t));lb.classList.add("open");lb.setAttribute("aria-hidden","false");if(lenis)lenis.stop();
});
const close=()=>{lb.classList.remove("open");lb.setAttribute("aria-hidden","true");if(lenis)lenis.start()};
lb.querySelector(".x").onclick=close;
lb.querySelector(".p").onclick=e=>{e.stopPropagation();show(idx-1)};
lb.querySelector(".nx").onclick=e=>{e.stopPropagation();show(idx+1)};
lb.onclick=e=>{if(e.target===lb)close()};
addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowRight")show(idx+1);if(e.key==="ArrowLeft")show(idx-1)});
</script>
</body>
